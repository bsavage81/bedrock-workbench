name: Build reviewed authoring data
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [stable, preview, both]
        default: stable
      publish:
        description: Publish the candidate if its fingerprint has been reviewed
        type: boolean
        default: false
      source_tag:
        description: Optional official source tag for historical coverage
        type: string
        default: ''
      stable_comparison_tag:
        description: Optional Stable comparison tag for historical Preview
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: authoring-data-publication
  cancel-in-progress: false
jobs:
  channel:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        channel: ${{ fromJSON((github.event_name == 'schedule' || inputs.channel == 'both') && '["stable","preview"]' || format('["{0}"]', inputs.channel)) }}
    uses: ./.github/workflows/channel.yml
    permissions:
      contents: write
    with:
      channel: ${{ matrix.channel }}
      publish: ${{ github.event_name == 'schedule' || inputs.publish == true }}
      source_tag: ${{ inputs.source_tag || '' }}
      stable_comparison_tag: ${{ inputs.stable_comparison_tag || '' }}
